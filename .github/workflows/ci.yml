name: CI
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - name: Start local Worker in mock mode
        run: |
          npx wrangler dev --config wrangler.mock.toml --ip 127.0.0.1 --port 8787 > worker.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8787/health; then exit 0; fi
            sleep 1
          done
          cat worker.log
          exit 1
      - run: npm run test:e2e
      - name: Worker logs
        if: failure()
        run: cat worker.log || true
